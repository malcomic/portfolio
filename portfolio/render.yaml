services:
  - name: portfolio-api
    type: web
    env: node
    branch: main
    rootDir: portfolio
    buildCommand: npm install && cd apps/api && npm run build
    startCommand: cd apps/api && npm start
    plan: free# Render Blueprint for Portfolio API
# Deploy: https://dashboard.render.com/select-repo

services:
  - type: web
    name: portfolio-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: npm start -w apps/api
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

